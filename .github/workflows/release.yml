name: Release

# Push a tag that matches plugin.json's version to publish the plugin:
#   git tag v0.1.0 && git push origin v0.1.0
# The release carries the .rgplugin package and the registry entry to submit.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  RUSTGIS_VERSION: ${{ vars.RUSTGIS_VERSION }}
  # A RustGIS branch to run the plugin in instead of the latest release (see ci.yml).
  RUSTGIS_REF: ${{ vars.RUSTGIS_REF }}

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # Nothing here pushes with git, and this job builds RustGIS main: keep the token out of .git.
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Build, check and package
        run: python scripts/package.py --tag "$GITHUB_REF_NAME"
      # The latest release (or RUSTGIS_VERSION), unless the plugin needs a newer RustGIS than
      # that: then rustgis-cli is built from RustGIS's main branch (or RUSTGIS_REF), where the
      # features a new minRustgisVersion waits for land before they are released.
      - name: Pick the RustGIS to run the plugin in
        id: pick
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="${RUSTGIS_VERSION:-$(gh release view --repo opengeos/RustGIS --json tagName --jq .tagName)}"
          need=$(python -c "import json; print(json.load(open('plugin.json')).get('minRustgisVersion', '0'))")
          newer=$(python -c "import sys; v=lambda s: [int(x) for x in s.lstrip('v').split('-')[0].split('.')]; print(str(v(sys.argv[2]) > v(sys.argv[1])).lower())" "$tag" "$need")
          # RUSTGIS_REF set: always that branch (a plugin using what the release doesn't have yet).
          if [ -n "$RUSTGIS_REF" ]; then newer=true; fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "main=$newer" >> "$GITHUB_OUTPUT"
          ref="${RUSTGIS_REF:-main}"
          sha=$(git ls-remote https://github.com/opengeos/RustGIS "refs/heads/$ref" | cut -f1)
          test -n "$sha" || { echo "::error::No branch '$ref' in opengeos/RustGIS (check RUSTGIS_REF)."; exit 1; }
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          if [ "$newer" = true ]; then
            echo "::notice::Running the plugin (minRustgisVersion $need) in rustgis-cli built from RustGIS $ref, not $tag."
          fi
      - name: Download rustgis-cli
        if: steps.pick.outputs.main != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.pick.outputs.tag }}
        run: |
          gh release download "$TAG" --repo opengeos/RustGIS --pattern 'RustGIS-*-linux-x86_64.tar.gz' --dir "$RUNNER_TEMP"
          tar xzf "$RUNNER_TEMP"/RustGIS-*-linux-x86_64.tar.gz -C "$RUNNER_TEMP"
          echo "RUSTGIS_CLI=$(ls "$RUNNER_TEMP"/RustGIS-*-linux-x86_64/rustgis-cli)" >> "$GITHUB_ENV"
      - name: Build rustgis-cli from RustGIS main (or RUSTGIS_REF)
        # Built here, not taken from CI's cache: this job can write releases.
        if: steps.pick.outputs.main == 'true'
        env:
          SHA: ${{ steps.pick.outputs.sha }}
        run: |
          cargo install --locked --git https://github.com/opengeos/RustGIS --rev "$SHA" rustgis-cli --root ~/rustgis-cli-root
          mkdir -p ~/rustgis-cli && cp ~/rustgis-cli-root/bin/rustgis-cli ~/rustgis-cli/
      # main carries the last release's version number until the next release, so the plugin
      # folder the smoke test loads asks for at most that one.
      - name: Use rustgis-cli from RustGIS main (or RUSTGIS_REF)
        if: steps.pick.outputs.main == 'true'
        env:
          TAG: ${{ steps.pick.outputs.tag }}
        run: |
          echo "RUSTGIS_CLI=$HOME/rustgis-cli/rustgis-cli" >> "$GITHUB_ENV"
          python - "$TAG" <<'PY'
          import json, pathlib, sys
          m = json.loads(pathlib.Path("plugin.json").read_text())
          f = pathlib.Path("dist") / m["id"] / "plugin.json"
          d = json.loads(f.read_text())
          v = lambda s: [int(x) for x in s.lstrip("v").split("-")[0].split(".")]
          if v(d.get("minRustgisVersion", "0")) > v(sys.argv[1]):
              d["minRustgisVersion"] = sys.argv[1].lstrip("v")
          f.write_text(json.dumps(d, indent=2))
          PY
      - name: Run the plugin in RustGIS
        run: python scripts/smoke.py --cli "$RUSTGIS_CLI"
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          id=$(python -c 'import json; print(json.load(open("plugin.json"))["id"])')
          version="${GITHUB_REF_NAME#v}"
          package="dist/$id-$version.rgplugin"
          sha=$(sha256sum "$package" | cut -d' ' -f1)
          {
            echo "Install it in RustGIS from **Plugins › Plugin Manager › Settings › Install From File…**, or with \`rustgis-cli plugins install $id-$version.rgplugin\`."
            echo
            echo "SHA-256: \`$sha\`"
            echo
            echo "To list this version in the [RustGIS plugin registry](https://plugins.rustgis.app), add \`registry/$id.json\` to [opengeos/rustgis-plugins](https://github.com/opengeos/rustgis-plugins) (see the README):"
            echo
            echo '```json'
            cat "dist/$id.json"
            echo '```'
          } > "$RUNNER_TEMP/notes.md"
          gh release create "$GITHUB_REF_NAME" "$package" "dist/$id.json" --title "$GITHUB_REF_NAME" --notes-file "$RUNNER_TEMP/notes.md" --verify-tag
